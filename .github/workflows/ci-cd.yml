name: WooCommerce CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Catalogue CSV a importer"
        required: true
        default: "data/produits_avec_descriptions.csv"
      images_root:
        description: "Dossier racine des images/videos"
        required: true
        default: "produits/images"
      deploy_mode:
        description: "Action a lancer"
        required: true
        type: choice
        default: "validate-only"
        options:
          - validate-only
          - publish-new
          - publish-update
      keep_existing_images:
        description: "Conserver les images deja presentes pendant une mise a jour"
        required: true
        type: boolean
        default: true
      check_media:
        description: "Verifier que chaque dossier produit contient au moins un media"
        required: true
        type: boolean
        default: false
      skip_images:
        description: "Ne pas envoyer les images pendant la publication"
        required: true
        type: boolean
        default: false
      skip_videos:
        description: "Ne pas envoyer les videos pendant la publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: woocommerce-${{ github.ref }}
  cancel-in-progress: false

env:
  CSV_PATH: ${{ github.event.inputs.csv_path || 'data/produits_avec_descriptions.csv' }}
  IMAGES_ROOT: ${{ github.event.inputs.images_root || 'produits/images' }}

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Guard private env file
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env ne doit jamais etre versionne."
            exit 1
          fi

      - name: Compile Python scripts
        run: python -m compileall scripts

      - name: Validate CSV content
        run: python scripts/validate_catalogue.py --csv "$CSV_PATH" --images-root "$IMAGES_ROOT"

      - name: Validate media folders
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.check_media == 'true' }}
        run: python scripts/validate_catalogue.py --csv "$CSV_PATH" --images-root "$IMAGES_ROOT" --check-media

      - name: Import dry run
        run: python scripts/importer_woocommerce.py --csv "$CSV_PATH" --images-root "$IMAGES_ROOT" --dry-run --skip-images --skip-videos

  publish:
    name: Publish to WooCommerce
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode != 'validate-only' }}
    environment: production

    env:
      WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
      WOOCOMMERCE_CONSUMER_KEY: ${{ secrets.WOOCOMMERCE_CONSUMER_KEY }}
      WOOCOMMERCE_CONSUMER_SECRET: ${{ secrets.WOOCOMMERCE_CONSUMER_SECRET }}
      WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
      WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish products
        shell: bash
        run: |
          args=(
            scripts/importer_woocommerce.py
            --csv "$CSV_PATH"
            --images-root "$IMAGES_ROOT"
            --execute
            --publish
          )

          if [[ "${{ github.event.inputs.deploy_mode }}" == "publish-update" ]]; then
            args+=(--update-existing)
          fi

          if [[ "${{ github.event.inputs.deploy_mode }}" == "publish-update" && "${{ github.event.inputs.keep_existing_images }}" == "true" ]]; then
            args+=(--keep-existing-images)
          fi

          if [[ "${{ github.event.inputs.skip_images }}" == "true" ]]; then
            args+=(--skip-images)
          fi

          if [[ "${{ github.event.inputs.skip_videos }}" == "true" ]]; then
            args+=(--skip-videos)
          fi

          python "${args[@]}"
